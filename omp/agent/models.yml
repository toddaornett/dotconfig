providers:
  ollama:
    api: openai-responses
    auth: none
    baseUrl: http://127.0.0.1:11434/v1
    discovery:
      type: ollama
    models:
      - contextWindow: 262144
        id: qwen3.6:latest
        input:
          - text
          - image
        name: qwen3.6:latest
      - contextWindow: 1048576
        id: glm-5.3-flash:cloud
        input:
          - text
        maxTokens: 1048576
        name: glm-5.3-flash:cloud
      - contextWindow: 1048576
        id: glm-5.3:cloud
        input:
          - text
        maxTokens: 1048576
        name: glm-5.3:cloud
      - contextWindow: 1048576
        id: deepseek-v4-flash:cloud
        input:
          - text
        maxTokens: 65536
        name: deepseek-v4-flash:cloud
      - contextWindow: 262144
        id: gemma4:31b-cloud
        input:
          - text
        maxTokens: 262144
        name: gemma4:31b-cloud
      - id: gemma4:26b
        input:
          - text
        name: gemma4:26b
  deepseek:
    baseUrl: https://api.deepseek.com
    api: openai-completions
    apiKey: DEEPSEEK_API_KEY
    authHeader: true
    models:
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        reasoning: true
        thinking:
          minLevel: high
          maxLevel: xhigh
          mode: effort
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          reasoningEffortMap:
            high: high
            xhigh: max
          supportsToolChoice: false
          requiresReasoningContentForToolCalls: true
          requiresAssistantContentForToolCalls: true
          extraBody:
            thinking:
              type: enabled
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash
        reasoning: true
        thinking:
          minLevel: high
          maxLevel: xhigh
          mode: effort
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          reasoningEffortMap:
            high: high
            xhigh: max
          supportsToolChoice: false
          requiresReasoningContentForToolCalls: true
          requiresAssistantContentForToolCalls: true
          extraBody:
            thinking:
              type: enabled
